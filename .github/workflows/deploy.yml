name: Deploy alanya-admin

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Toute erreur arrête le déploiement et le fait échouer. Sans ça,
            # un `git pull` refusé laissait le script compiler l'ancien code,
            # redémarrer, et GitHub affichait « success » : le panneau est
            # resté figé des semaines ainsi.
            set -e
            cd /var/www/alanya-admin
            # Le serveur ne porte aucune modification à conserver : il se
            # réaligne sur main, comme le backend. Un `git pull` abandonnait
            # dès qu'un fichier suivi (package-lock.json, réécrit par un
            # `npm install` lancé à la main) différait du dépôt.
            git fetch origin main
            git reset --hard origin/main
            npm ci
            # Pas de NEXT_PUBLIC_API_URL ici : une variable posée en ligne de
            # commande prime sur .env.production dans Next.js. Cette ligne
            # portait encore http://158.220.107.211/api et aurait reconstruit le
            # panneau vers l'ancien VPS, dont le backend est arrêté — en
            # annulant en silence le changement de .env.production.
            npm run build
            pm2 restart alanya-admin